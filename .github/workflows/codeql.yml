name: codeql
run-name: "codeql from ${{ github.ref_name }}"
# A push to a branch and its pull request are separate refs, so each keeps its own
# run and only supersedes its own predecessor.
concurrency:
  group: codeql-spreadsheets-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '47 1,2,6 * * *'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'infra/**'
      - 'behaviour-tests/**'
      - 'web/**'
      - 'packages/**'
      - 'scripts/**'
      - '**/cdk.json'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'pom.xml'
      - '.github/workflows/**'
      - '.prettierignore'
      - '.prettierrc'
      - 'eslint.config.js'
      - 'playwright.config.js'
      - 'vitest.config.js'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - java-kotlin
          - javascript-typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: '/language:${{ matrix.language }}'
