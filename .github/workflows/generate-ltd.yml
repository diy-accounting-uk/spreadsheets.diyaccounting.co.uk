name: generate-ltd
run-name: "generate-ltd from ${{ github.ref_name }}"
concurrency:
  group: ltd-packages-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Monthly (25th): rolls the catalogue's year-end window forward and keeps
    # repo activity above GitHub's 60-day disabled_inactivity threshold. The
    # DAILY schedule stays off — its mass-commit volume contributed to the
    # 2026-05 flagging incident; one deliberate run a month does not.
    - cron: '47 4 25 * *'
  # push trigger disabled 2026-05-07: this workflow self-commits 50-300 generated
  # Excel files per run. Combined with the daily schedule, that produced a high
  # volume of bot-authored mass-file-change commits — a pattern that contributes
  # to GitHub's account-takeover/abuse heuristics. Run via workflow_dispatch or
  # the schedule only until generated artefacts move out of git.
  # push:
  #   branches:
  #     - '**'
  #     - '!gh_pages'
  #   paths:
  #     - 'app/data/ltd-*'
  #     - 'app/templates/ltd/**'
  #     - 'app/templates/meta.toml'
  #     - 'app/products/ltd.js'
  #     - '.github/workflows/generate-ltd.yml'
  workflow_call:
    inputs:
      skip-tests:
        type: boolean
        default: false
      skip-generation:
        type: boolean
        default: false
      skip-reconciliation:
        type: boolean
        default: false
      skip-commit:
        type: boolean
        default: false
      reconcile-all:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      skip-tests:
        description: 'Skip tests'
        type: boolean
        default: false
      skip-generation:
        description: 'Skip generation'
        type: boolean
        default: false
      skip-reconciliation:
        description: 'Skip reconciliation'
        type: boolean
        default: false
      skip-commit:
        description: 'Skip commit'
        type: boolean
        default: false
      reconcile-all:
        description: 'Reconcile all packages (not just latest 24 months)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: '24'
  AWS_REGION: 'us-east-1'

jobs:

  params:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: "github.event_name=[${{ github.event_name }}]"
        run: ":"
      - name: "github.ref=[${{ github.ref }}]"
        run: ":"
      - name: "inputs.skip-tests=[${{ inputs.skip-tests }}]"
        run: ":"
      - name: "inputs.skip-generation=[${{ inputs.skip-generation }}]"
        run: ":"
      - name: "inputs.skip-reconciliation=[${{ inputs.skip-reconciliation }}]"
        run: ":"
      - name: "inputs.skip-commit=[${{ inputs.skip-commit }}]"
        run: ":"
      - name: "inputs.reconcile-all=[${{ inputs.reconcile-all }}]"
        run: ":"
      - name: Normalise Params
        id: normalise
        shell: bash
        run: |
          SKIP_TESTS='${{ inputs.skip-tests }}'; [[ -z "$SKIP_TESTS" ]] && SKIP_TESTS="false"
          echo "skip-tests=${SKIP_TESTS}" | tee -a "$GITHUB_OUTPUT"
          SKIP_GENERATION='${{ inputs.skip-generation }}'; [[ -z "$SKIP_GENERATION" ]] && SKIP_GENERATION="false"
          echo "skip-generation=${SKIP_GENERATION}" | tee -a "$GITHUB_OUTPUT"
          SKIP_RECONCILIATION='${{ inputs.skip-reconciliation }}'; [[ -z "$SKIP_RECONCILIATION" ]] && SKIP_RECONCILIATION="false"
          echo "skip-reconciliation=${SKIP_RECONCILIATION}" | tee -a "$GITHUB_OUTPUT"
          SKIP_COMMIT='${{ inputs.skip-commit }}'; [[ -z "$SKIP_COMMIT" ]] && SKIP_COMMIT="false"
          echo "skip-commit=${SKIP_COMMIT}" | tee -a "$GITHUB_OUTPUT"
          RECONCILE_ALL='${{ inputs.reconcile-all }}'; [[ -z "$RECONCILE_ALL" ]] && RECONCILE_ALL="false"
          echo "reconcile-all=${RECONCILE_ALL}" | tee -a "$GITHUB_OUTPUT"
    outputs:
      skip-tests: ${{ steps.normalise.outputs.skip-tests }}
      skip-generation: ${{ steps.normalise.outputs.skip-generation }}
      skip-reconciliation: ${{ steps.normalise.outputs.skip-reconciliation }}
      skip-commit: ${{ steps.normalise.outputs.skip-commit }}
      reconcile-all: ${{ steps.normalise.outputs.reconcile-all }}

  test:
    runs-on: ubuntu-24.04
    needs: [params]
    if: ${{ needs.params.outputs.skip-tests != 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - run: npm test

  generate:
    runs-on: ubuntu-24.04
    needs: [params, test]
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.params.outputs.skip-generation != 'true' }}
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.matrix.outputs.year-ends }}
      latest: ${{ steps.matrix.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Install pandoc and weasyprint
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pandoc
          pip install --quiet weasyprint
      - run: rm -rf packages
      - run: npm run generate -- --package ltd
      - run: npm test
      - name: Compute reconciliation matrix
        id: matrix
        env:
          RECONCILE_ALL: ${{ needs.params.outputs.reconcile-all }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          ALL_YEAR_ENDS=$(ls -d packages/GB\ Accounts\ Company*/ 2>/dev/null \
            | sed 's|.*/GB Accounts Company \([0-9-]*\).*|\1|' \
            | sort -r)
          if [[ "$RECONCILE_ALL" == "true" ]]; then
            YEAR_ENDS=$(echo "$ALL_YEAR_ENDS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            # Three representative year-ends rather than the full monthly
            # rotation: the year-ends are mechanical tab-name/formula-rewrite
            # rotations of the same template (see app/lib/spreadsheet-runner.js
            # getMonthTabSequence), and the JSZip catalogue guards already
            # cover the per-year-end variation across every shipped package.
            # LibreOffice reconciliation only needs one representative of each
            # rewrite class:
            #   - latest March: the template's native tab order, no rename
            #   - latest June: a 30-day mid-year month, fully rewritten tabs
            #   - latest February: the short month, and (on a leap year) the
            #     class of year-end that straddles a Feb 29 FY
            LATEST_MARCH=$(echo "$ALL_YEAR_ENDS" | grep -m1 -- '-03-31$')
            LATEST_JUNE=$(echo "$ALL_YEAR_ENDS" | grep -m1 -- '-06-30$')
            LATEST_FEBRUARY=$(echo "$ALL_YEAR_ENDS" | grep -m1 -E -- '-02-(28|29)$')
            YEAR_ENDS=$(printf '%s\n' "$LATEST_MARCH" "$LATEST_JUNE" "$LATEST_FEBRUARY" \
              | sed '/^$/d' | sort -ru \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "year-ends=$YEAR_ENDS" | tee -a "$GITHUB_OUTPUT"
          LATEST=$(echo "$ALL_YEAR_ENDS" | head -1)
          echo "latest=$LATEST" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ltd-packages
          retention-days: 1
          path: packages/

  reconcile:
    runs-on: ubuntu-24.04
    needs: [params, generate]
    if: ${{ !cancelled() && (needs.generate.result == 'success' || needs.generate.result == 'skipped') && needs.params.outputs.skip-reconciliation != 'true' && needs.generate.outputs.matrix != '[]' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        year-end: ${{ fromJson(needs.generate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Install LibreOffice
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-calc poppler-utils
      - uses: actions/download-artifact@v8
        with:
          name: ltd-packages
          path: packages/
      - name: Keep the committed reports for the page build
        if: ${{ matrix.year-end == needs.generate.outputs.latest }}
        run: |
          mkdir -p /tmp/page-reports
          cp reports/*.md /tmp/page-reports/ 2>/dev/null || true
      - run: rm -f reports/*.md
      - run: npm run reconciliation -- --package ltd --scenario full --year-end ${{ matrix.year-end }}
      - name: Check reconciliation
        run: |
          COUNT=0
          FAIL=0
          for f in reports/*.md; do
            [ -f "$f" ] || continue
            COUNT=$((COUNT + 1))
            if grep "^Status:" "$f" | grep -q "ANOMALYDETECTED"; then FAIL=1; fi
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No reconciliation reports for ${{ matrix.year-end }}"
            exit 1
          fi
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Reconciliation anomaly for ${{ matrix.year-end }}"
            exit 1
          fi
          echo "$COUNT reports, all RECONCILES"
      # The check above stays authoritative for arithmetic. The judge covers the plausibility
      # call it cannot make, and stays skipped until the operator sets ENABLE_LLM_JUDGE.
      - name: Locate the recalculated package for the scorecard
        id: roundtrip
        run: |
          POPULATED=$(ls -d reports/populated/*ltd-scenario-full 2>/dev/null | head -1)
          if [ -z "$POPULATED" ]; then
            echo "::warning::No recalculated package for ${{ matrix.year-end }}; skipping the roundtrip scorecard"
            echo "populated=" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "populated=$POPULATED" | tee -a "$GITHUB_OUTPUT"
          # The fixture's transactions carry the master's own fixed calendar
          # dates whichever year-end directory they are stamped into --
          # cellWrites never shifts them -- so the master's own FY tax rates
          # are the only sensible --years for the JS side; there is no offset
          # that would make the dates themselves line up with a chosen month
          # end other than the master's own.
          YE="${{ matrix.year-end }}"
          Y=$((10#${YE:0:4})); M=$((10#${YE:5:2}))
          FYSTART=$Y
          if [ "$M" -le 3 ]; then FYSTART=$((Y - 1)); fi
          echo "years=ltd-$FYSTART" | tee -a "$GITHUB_OUTPUT"
      - name: 'Roundtrip scorecard against the recalculated package (EQ2 budget gate, EQ1 informational)'
        if: ${{ steps.roundtrip.outputs.populated != '' }}
        run: |
          node app/bin/report.js --package ltd --source-dir "${{ steps.roundtrip.outputs.populated }}" --mode saved --year-end ${{ matrix.year-end }} --output-dir target/ltd-scorecard-excel
          node app/bin/export.js --package ltd --source-dir "${{ steps.roundtrip.outputs.populated }}" --output-dir target/ltd-scorecard-excel/data
          node app/bin/report.js --package ltd --data examples/precision-code-ltd/full --years ${{ steps.roundtrip.outputs.years }} --output-dir target/ltd-scorecard-js
          # Only linesLost and fieldsDropped are gated here
          # (app/data/roundtrip-matrix-budget.json), not differing/noJsValue/
          # noExcelValue: this package's own VAT-quarter and CT600 labels are
          # anchored to its own year-end, while the fixture's dates never move
          # off the master's, so the report-half comparison is only exact for
          # the one year-end that happens to equal the master's own period end
          # (examples/precision-code-ltd/full/book.toml's periodCoveredEnd).
          # The scorecard still prints in full for visibility.
          node app/bin/verify-roundtrip.js --package ltd --excel target/ltd-scorecard-excel --js target/ltd-scorecard-js --budget app/data/roundtrip-matrix-budget.json
      - name: 'EQ3: stability of the recalculated package'
        if: ${{ steps.roundtrip.outputs.populated != '' }}
        run: node app/bin/verify-stability.js --package ltd --source-dir "${{ steps.roundtrip.outputs.populated }}" --output-dir target/ltd-scorecard-stability
      - name: Configure AWS role via GitHub OIDC
        if: ${{ matrix.year-end == needs.generate.outputs.latest && vars.ENABLE_LLM_JUDGE == 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SPREADSHEETS_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3
      - name: Judge the reconciliation reports
        if: ${{ matrix.year-end == needs.generate.outputs.latest && vars.ENABLE_LLM_JUDGE == 'true' }}
        timeout-minutes: 10
        run: npm run judge:reconciliation -- --package ltd
      - name: Copy latest populated to examples
        if: ${{ matrix.year-end == needs.generate.outputs.latest }}
        run: |
          rm -rf examples/ltd-latest
          POPULATED=$(ls -d reports/populated/*ltd-scenario-full 2>/dev/null | head -1)
          if [ -d "$POPULATED" ]; then
            cp -r "$POPULATED" examples/ltd-latest
            echo "Copied $POPULATED to examples/ltd-latest"
          fi
      - name: Build the reconciliation page
        if: ${{ matrix.year-end == needs.generate.outputs.latest }}
        run: |
          cp -f reports/*.md /tmp/page-reports/
          cp -f reports/judge-verdict-*.json /tmp/page-reports/ 2>/dev/null || true
          npm run build:reconciliation-pages -- --product ltd --reports /tmp/page-reports
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.year-end == needs.generate.outputs.latest }}
        with:
          name: ltd-reconciliation-page
          retention-days: 1
          path: web/spreadsheets.diyaccounting.co.uk/public/reconciliation/
      - run: rm -rf reports/populated
      - uses: actions/upload-artifact@v7
        with:
          name: ltd-reports-${{ matrix.year-end }}
          retention-days: 1
          path: reports/
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.year-end == needs.generate.outputs.latest }}
        with:
          name: ltd-examples
          retention-days: 1
          path: examples/

  reconcile-extra:
    runs-on: ubuntu-24.04
    needs: [params, generate, reconcile]
    if: ${{ !cancelled() && needs.reconcile.result == 'success' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Install LibreOffice
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-calc
      - uses: actions/download-artifact@v8
        with:
          name: ltd-packages
          path: packages/
      - run: rm -f reports/*.md
      - name: Reconcile extra scenarios against latest package
        run: |
          npm run reconciliation -- --package ltd --scenario brickwork-pro-nonvat --year-end ${{ needs.generate.outputs.latest }}
          npm run reconciliation -- --package ltd --scenario brickwork-pro-vat --year-end ${{ needs.generate.outputs.latest }}
      - uses: actions/upload-artifact@v7
        with:
          name: ltd-extra-reports
          retention-days: 1
          path: reports/
      - name: Check extra reconciliation
        run: |
          COUNT=0
          FAIL=0
          for f in reports/*.md; do
            [ -f "$f" ] || continue
            COUNT=$((COUNT + 1))
            if grep "^Status:" "$f" | grep -q "ANOMALYDETECTED"; then FAIL=1; fi
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No extra reconciliation reports"
          elif [ "$FAIL" -eq 1 ]; then
            echo "::warning::Extra reconciliation anomaly (non-blocking)"
          else
            echo "$COUNT extra reports, all RECONCILES"
          fi

  commit:
    runs-on: ubuntu-24.04
    needs: [params, generate, reconcile, reconcile-extra]
    if: ${{ !cancelled() && (needs.reconcile.result == 'success' || needs.reconcile.result == 'skipped') && needs.params.outputs.skip-commit != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: ltd-packages
          path: packages/
      - uses: actions/download-artifact@v8
        with:
          pattern: ltd-reports-*
          path: reports/
          merge-multiple: true
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ltd-examples
          path: examples/
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ltd-reconciliation-page
          path: web/spreadsheets.diyaccounting.co.uk/public/reconciliation/
      - name: Commit and push
        id: push
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rf --ignore-unmatch reports/screenshots/ reports/populated/
          git add packages/ reports/ examples/ web/spreadsheets.diyaccounting.co.uk/public/reconciliation/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git diff --staged --name-only | head -50
            git commit -m "Generate Ltd Company packages from app/data and app/templates

          Triggered by: ${{ github.sha }}"
            git pull --rebase
            git push
          fi
      - name: Retry push after delay
        if: ${{ steps.push.outcome == 'failure' }}
        run: |
          for i in 5 10 15 20 25 30; do
            echo "Waiting... ${i}s"
            sleep 5
          done
          git pull --rebase
          git push
