name: test
run-name: "test from ${{ github.ref_name }}"
# A push to a branch and its pull request are separate refs, so each keeps its own
# run and only supersedes its own predecessor.
concurrency:
  group: test-spreadsheets-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '47 1,2,6 * * *'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'infra/**'
      - 'behaviour-tests/**'
      - 'web/**'
      - 'packages/**'
      - 'packages/**'
      - 'scripts/**'
      - '**/cdk.json'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'pom.xml'
      - '.github/workflows/test.yml'
      - '.prettierignore'
      - '.prettierrc'
      - 'eslint.config.js'
      - 'playwright.config.js'
      - 'vitest.config.js'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '24'

jobs:

  lint-workflows:
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          # actionlint is not an Ubuntu package; take the pinned release binary.
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Validate workflows
        run: ./scripts/validate-workflows.sh

  deploy-filter-coverage:
    # deploy.yml's push paths filter decides whether a push deploys; this is
    # the gates-tier check that deploy.yml decides at all, so it runs whether
    # or not a local pre-push hook already did (a GitHub-side merge or a push
    # with hooks bypassed reaches this job either way).
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Check deploy.yml's paths filter covers the DIYA-GL bundle's reads
        run: npm run gate:deploy-filter

  green-check:
    # A hit here means: this exact non-Markdown tree already ran the whole
    # suite green once, either as a PR's merge ref whose merge commit later
    # landed on main with only NEXT.md board lines added (the docs
    # exception), or as a scheduled run landing on a hash a recent push
    # already covered. Either way the tree the tiers below would exercise
    # is one already proven, so they are skipped and this run inherits that
    # result instead of re-paying for it.
    #
    # actions/cache is not used for the record: a cache written by a
    # pull_request run is scoped to that PR's merge ref and invisible to
    # the later push run on main that carries the same tree. A workflow
    # artifact is visible across branches through the API, so the record
    # survives the ref boundary a docs-only PR merge crosses.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      green: ${{ steps.check.outputs.green }}
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Hash the tree with every Markdown path removed
        id: hash
        run: echo "hash=$(node scripts/test-scope.mjs --code-tree-hash)" | tee -a "$GITHUB_OUTPUT"

      - name: Look for a prior GREEN record at this hash
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          FOUND=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=green-${HASH}&per_page=5" \
            --jq '[.artifacts[] | select(.expired == false)][0] // empty')
          if [ -n "$FOUND" ]; then
            echo "green=true" | tee -a "$GITHUB_OUTPUT"
            echo "$FOUND" | jq -r '"reusing run " + (.workflow_run.id | tostring) + " (head " + .workflow_run.head_sha[0:9] + ", recorded " + .created_at + ")"'
          else
            echo "green=false" | tee -a "$GITHUB_OUTPUT"
            echo "no prior GREEN record for $HASH"
          fi

  build:
    needs: [green-check]
    if: needs.green-check.outputs.green != 'true'
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Generate latest BST package
        run: |
          LATEST=$(ls app/data/se-*.toml | sort | tail -1 | xargs basename -s .toml)
          echo "Generating: $LATEST"
          npm run generate -- --package bst --years "$LATEST"

  deployment:
    needs: [green-check]
    if: needs.green-check.outputs.green != 'true'
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Build spreadsheets redirects
        run: npm run build:redirects

      - name: Build the diya-gl spec page
        run: npm run build:diya-gl-spec

      - name: Build sitemaps
        run: npm run build:sitemaps

      - name: Build the donate page
        run: npm run build:donate-page

      - uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Maven verify (skip tests)
        run: ./mvnw --errors clean verify -DskipTests -Dmaven.compiler.source=${{ env.JAVA_VERSION }} -Dmaven.compiler.target=${{ env.JAVA_VERSION }}

      - name: CDK synth
        run: npm run cdk:synth

  infra-test:
    needs: [green-check]
    if: needs.green-check.outputs.green != 'true'
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Maven verify
        run: ./mvnw --errors clean verify -Dmaven.compiler.source=${{ env.JAVA_VERSION }} -Dmaven.compiler.target=${{ env.JAVA_VERSION }}

  app-test:
    needs: [green-check]
    if: needs.green-check.outputs.green != 'true'
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LibreOffice Calc
        if: ${{ !cancelled() }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Verify scenario fixtures and diya-gl subsets in sync with master data
        run: node app/bin/extract-scenarios.js && git diff --exit-code app/test/fixtures/ examples/

      - name: Build provenance data
        run: npm run build:provenance-data

      - name: Run tests
        run: npm test
        env:
          # The gate, browser and infra tiers have their own jobs, so this one
          # routes the app tiers. Anything it delegates prints as DELEGATED.
          TEST_SCOPE_TIERS: unit,calc

      - name: Run CI-only export-tuple check
        # Outside scripts/test-scope.mjs's routing, by filename convention --
        # see app/test/verify-roundtrip-export-tuple.ci.spec.js's own header.
        run: npx vitest run --project ci-only --reporter=tap-flat

  roundtrip-bst:
    name: 'roundtrip fidelity (BST)'
    needs: [green-check]
    if: needs.green-check.outputs.green != 'true'
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LibreOffice Calc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Generate BST package from diya-gl data
        run: node app/bin/generate.js --package bst --years se-2025-2026 --year-end 2026-04-05 --data examples/precision-code-ltd/bst --output-dir target/bst-pkg --skip-guide

      - name: Extract reports from Excel package
        run: node app/bin/report.js --package bst --source-dir target/bst-pkg --data examples/precision-code-ltd/bst --years se-2025-2026 --output-dir target/bst-excel

      - name: Compute reports from diya-gl via JS engine
        run: node app/bin/report.js --package bst --data examples/precision-code-ltd/bst --years se-2025-2026 --output-dir target/bst-js

      - name: Export diya-gl data from Excel package
        run: node app/bin/export.js --package bst --source-dir target/bst-pkg --output-dir target/bst-excel/data

      - name: 'Roundtrip scorecard (EQ1 and EQ2, budget gate)'
        run: node app/bin/verify-roundtrip.js --package bst --excel target/bst-excel --js target/bst-js --budget app/data/roundtrip-budget.json

      - name: 'EQ3: stability of the recalculated package'
        run: node app/bin/verify-stability.js --package bst --source-dir target/bst-pkg --output-dir target/bst-stability

      - name: 'Double-roundtrip: re-generate from exported data'
        run: node app/bin/generate.js --package bst --years se-2025-2026 --year-end 2026-04-05 --data target/bst-excel/data --output-dir target/bst-pkg2 --skip-guide

      - name: 'Double-roundtrip: re-export'
        run: node app/bin/export.js --package bst --source-dir target/bst-pkg2 --output-dir target/bst-exported-data2

      - name: 'Double-roundtrip: pass 2 == pass 1 (MUST PASS)'
        run: diff target/bst-excel/data/lines.jsonl target/bst-exported-data2/lines.jsonl

  roundtrip-taxi:
    name: 'roundtrip fidelity (Taxi)'
    needs: [green-check]
    if: needs.green-check.outputs.green != 'true'
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LibreOffice Calc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Generate Taxi package from diya-gl data
        run: node app/bin/generate.js --package taxi --years se-2025-2026 --year-end 2026-04-05 --data examples/sp-sixty-driving/taxi --output-dir target/taxi-pkg --skip-guide

      - name: Extract reports from Excel package
        run: node app/bin/report.js --package taxi --source-dir target/taxi-pkg --mode recalculate --data examples/sp-sixty-driving/taxi --years se-2025-2026 --year-end 2026-04-05 --output-dir target/taxi-excel

      - name: Compute reports from diya-gl via JS engine
        run: node app/bin/report.js --package taxi --data examples/sp-sixty-driving/taxi --years se-2025-2026 --output-dir target/taxi-js

      - name: Export diya-gl data from Excel package
        run: node app/bin/export.js --package taxi --source-dir target/taxi-pkg --output-dir target/taxi-excel/data

      - name: 'Roundtrip scorecard (EQ1 and EQ2, budget gate)'
        run: node app/bin/verify-roundtrip.js --package taxi --excel target/taxi-excel --js target/taxi-js --budget app/data/roundtrip-budget.json

      - name: 'EQ3: stability of the recalculated package'
        run: node app/bin/verify-stability.js --package taxi --source-dir target/taxi-pkg --output-dir target/taxi-stability

      - name: 'Double-roundtrip: re-generate from exported data'
        run: node app/bin/generate.js --package taxi --years se-2025-2026 --year-end 2026-04-05 --data target/taxi-excel/data --output-dir target/taxi-pkg2 --skip-guide

      - name: 'Double-roundtrip: re-export'
        run: node app/bin/export.js --package taxi --source-dir target/taxi-pkg2 --output-dir target/taxi-exported-data2

      - name: 'Double-roundtrip: pass 2 == pass 1 (MUST PASS)'
        run: diff target/taxi-excel/data/lines.jsonl target/taxi-exported-data2/lines.jsonl

  roundtrip-se:
    name: 'roundtrip fidelity (SE)'
    needs: [green-check]
    if: needs.green-check.outputs.green != 'true'
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LibreOffice Calc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Generate SE package from diya-gl data
        run: node app/bin/generate.js --package se --years se-2025-2026 --year-end 2026-04-05 --data examples/precision-code-ltd/advanced --output-dir target/se-pkg --skip-guide

      - name: Extract reports from Excel package
        run: node app/bin/report.js --package se --source-dir target/se-pkg --data examples/precision-code-ltd/advanced --years se-2025-2026 --output-dir target/se-excel

      - name: Compute reports from diya-gl via JS engine
        run: node app/bin/report.js --package se --data examples/precision-code-ltd/advanced --years se-2025-2026 --output-dir target/se-js

      - name: Export diya-gl data from Excel package
        run: node app/bin/export.js --package se --source-dir target/se-pkg --output-dir target/se-excel/data

      - name: 'Roundtrip scorecard (EQ1 and EQ2, budget gate)'
        run: node app/bin/verify-roundtrip.js --package se --excel target/se-excel --js target/se-js --budget app/data/roundtrip-budget.json

      - name: 'EQ3: stability of the recalculated package'
        run: node app/bin/verify-stability.js --package se --source-dir target/se-pkg --output-dir target/se-stability

      - name: 'Double-roundtrip: re-generate from exported data'
        run: node app/bin/generate.js --package se --years se-2025-2026 --year-end 2026-04-05 --data target/se-excel/data --output-dir target/se-pkg2 --skip-guide

      - name: 'Double-roundtrip: re-export'
        run: node app/bin/export.js --package se --source-dir target/se-pkg2 --output-dir target/se-exported-data2

      - name: 'Double-roundtrip: pass 2 == pass 1 (MUST PASS)'
        run: diff target/se-excel/data/lines.jsonl target/se-exported-data2/lines.jsonl

  roundtrip-ltd:
    name: 'roundtrip fidelity (Ltd)'
    needs: [green-check]
    if: needs.green-check.outputs.green != 'true'
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LibreOffice Calc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Generate Ltd package from diya-gl data with offset
        run: node app/bin/generate.js --package ltd --years ltd-2024 --year-end 2025-03-31 --data examples/precision-code-ltd/full --offset '-P1Y' --output-dir target/ltd-pkg --skip-guide

      - name: Extract reports from Excel package
        run: node app/bin/report.js --package ltd --source-dir target/ltd-pkg --data examples/precision-code-ltd/full --offset '-P1Y' --years ltd-2024 --year-end 2025-03-31 --output-dir target/ltd-excel

      - name: Compute reports from diya-gl via JS engine
        run: node app/bin/report.js --package ltd --data examples/precision-code-ltd/full --offset '-P1Y' --years ltd-2024 --output-dir target/ltd-js

      - name: Export diya-gl data from Excel package
        run: node app/bin/export.js --package ltd --source-dir target/ltd-pkg --output-dir target/ltd-excel/data

      - name: 'Roundtrip scorecard (EQ1 and EQ2, budget gate)'
        run: node app/bin/verify-roundtrip.js --package ltd --excel target/ltd-excel --js target/ltd-js --budget app/data/roundtrip-budget.json

      - name: 'EQ3: stability of the recalculated package'
        run: node app/bin/verify-stability.js --package ltd --source-dir target/ltd-pkg --output-dir target/ltd-stability

      - name: 'Double-roundtrip: re-generate from exported data'
        run: node app/bin/generate.js --package ltd --years ltd-2024 --year-end 2025-03-31 --data target/ltd-excel/data --output-dir target/ltd-pkg2 --skip-guide

      - name: 'Double-roundtrip: re-export'
        run: node app/bin/export.js --package ltd --source-dir target/ltd-pkg2 --output-dir target/ltd-exported-data2

      - name: 'Double-roundtrip: pass 2 == pass 1 (MUST PASS)'
        run: diff target/ltd-excel/data/lines.jsonl target/ltd-exported-data2/lines.jsonl

  browser-test:
    needs: [green-check]
    if: needs.green-check.outputs.green != 'true'
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          retention-days: 7
          path: target/browser-test-results/

  behaviour-test:
    name: 'behaviour test (local)'
    needs: [green-check]
    if: needs.green-check.outputs.green != 'true'
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build packages (zips + catalogue)
        run: npm run build:packages -- --years 2

      - name: Build the diya-gl spec page
        run: npm run build:diya-gl-spec

      - name: Build sitemaps
        run: npm run build:sitemaps

      - name: Build the donate page
        run: npm run build:donate-page

      - name: Build provenance data
        run: npm run build:provenance-data

      - name: Build the DIYA-GL engine bundle
        run: npm run build:diya-gl-bundle

      - name: Symlink zips into public directory
        run: ln -sfn ../../../target/zips web/spreadsheets.diyaccounting.co.uk/public/zips

      - name: Start local server
        run: |
          nohup npx http-server web/spreadsheets.diyaccounting.co.uk/public -p 3000 > /tmp/http-server.log 2>&1 &

      - name: Start local diya-gl server
        run: |
          nohup npx http-server web/diya-gl.co.uk/public -p 3001 > /tmp/http-server-diya-gl.log 2>&1 &

      - name: Wait for server
        run: npx wait-on http://localhost:3000 http://localhost:3001 --timeout 30000

      - name: Run spreadsheets behaviour tests
        run: npm run test:spreadsheetsBehaviour-local
        env:
          DIYA_GL_BASE_URL: http://localhost:3001

      - name: Show server logs
        if: ${{ !cancelled() }}
        run: |
          cat /tmp/http-server.log 2>/dev/null || echo "No server log found"
          cat /tmp/http-server-diya-gl.log 2>/dev/null || echo "No diya-gl server log found"

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: behaviour-test-local
          retention-days: 7
          path: target/behaviour-test-results/

  pack-diya-gl:
    name: 'pack diya-gl, smoke and parity'
    needs: [green-check]
    if: needs.green-check.outputs.green != 'true'
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Build provenance data
        run: npm run build:provenance-data

      - name: diya-gl package dependencies
        run: cd diya-gl && npm ci

      - name: Pack diya-gl and run each bin from the tarball
        run: diya-gl/smoke.sh target/diya-gl-smoke

      - name: Find the packed tarball
        id: tarball
        run: |
          TARBALL=$(basename "$(ls target/diya-gl-smoke/*.tgz)")
          echo "name=${TARBALL}" | tee -a "$GITHUB_OUTPUT"

      - name: Build the diya-gl image
        run: |
          VERSION=$(node -p "require('./diya-gl/package.json').version")
          docker build \
            --build-arg TARBALL="${{ steps.tarball.outputs.name }}" \
            --build-arg VERSION="$VERSION" \
            -t diya-gl:test \
            -f diya-gl/Dockerfile \
            target/diya-gl-smoke

      - name: Image smoke test
        run: diya-gl/image-smoke.sh diya-gl:test "$PWD"

      - name: 'Parity gate: the packed CLI against the committed report.json and bookchecks.json'
        run: diya-gl/parity.sh target/diya-gl-parity

  reconciliation-check:
    name: 'check reconciliation reports'
    needs: [green-check]
    if: needs.green-check.outputs.green != 'true'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/checkout@v7
      - name: Check all reports are RECONCILES
        run: |
          if [ ! -d reports ] || [ -z "$(ls reports/*.md 2>/dev/null)" ]; then
            echo "::error::No reconciliation reports found in reports/"
            exit 1
          fi
          echo "=== Reconciliation Reports ==="
          FAIL=0
          for f in reports/*.md; do
            status=$(grep "^Status:" "$f" | head -1)
            echo "  $(basename "$f"): $status"
            if echo "$status" | grep -q "ANOMALYDETECTED"; then
              FAIL=1
            fi
          done
          echo ""
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Reconciliation reports contain ANOMALYDETECTED packages"
            exit 1
          fi
          echo "All reconciliation reports are RECONCILES"

  green-record:
    name: 'record this GREEN run'
    # Every job the workflow runs, gated or not: a failure anywhere means
    # this tree is not GREEN, whether the job that failed was skippable on
    # a hit or not. `needs.*.result` sees 'skipped' for a job green-check
    # gated off (the hash matched, so build/deployment/... never ran) --
    # that is not a failure, so it does not block the record. It cannot
    # both be true that green-check found a hit (skipping every gated job)
    # and that this job's own `green != 'true'` condition passes, so this
    # never re-uploads a record that already exists.
    needs:
      - green-check
      - lint-workflows
      - deploy-filter-coverage
      - build
      - deployment
      - infra-test
      - app-test
      - roundtrip-bst
      - roundtrip-taxi
      - roundtrip-se
      - roundtrip-ltd
      - browser-test
      - behaviour-test
      - pack-diya-gl
      - reconciliation-check
    if: ${{ !cancelled() && needs.green-check.outputs.green != 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Hash the tree with every Markdown path removed
        id: hash
        run: echo "hash=$(node scripts/test-scope.mjs --code-tree-hash)" | tee -a "$GITHUB_OUTPUT"

      - name: Write the record
        run: |
          mkdir -p target/green-record
          {
            echo "run_id=${{ github.run_id }}"
            echo "head_sha=${{ github.sha }}"
            echo "recorded_at=$(date -u +%FT%TZ)"
          } > target/green-record/record.txt

      - name: Upload the GREEN record
        uses: actions/upload-artifact@v7
        with:
          name: green-${{ steps.hash.outputs.hash }}
          path: target/green-record/record.txt
          retention-days: 30
