name: generate-bst
run-name: "generate-bst from ${{ github.ref_name }}"
concurrency:
  group: ${{ github.event_name == 'push' && format('bst-packages-push-{0}', github.ref) || format('bst-packages-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

on:
  #schedule:
  #  - cron: '17 3 * * *'
  #workflow_dispatch:
  # A change to what the packages are built from regenerates them on main, and the
  # commit job stages every package file whose bytes changed. The bot commit touches
  # packages/ alone and is pushed with GITHUB_TOKEN, so it starts no run of its own.
  push:
    branches:
      - main
    paths:
      - 'app/templates/**'
      - 'app/data/**'
      - '!app/data/releases.json'
      - 'app/products/**'
      - 'app/lib/**'
      - '!app/lib/provenance-data.js'
      - 'app/bin/generate.js'
      - '.github/workflows/generate-bst.yml'
  workflow_call:
    inputs:
      skip-tests:
        type: boolean
        default: false
      skip-generation:
        type: boolean
        default: false
      skip-reconciliation:
        type: boolean
        default: false
      skip-commit:
        type: boolean
        default: false
      commit-scope:
        type: string
        default: 'changed-packages'
  workflow_dispatch:
    inputs:
      skip-tests:
        description: 'Skip tests'
        type: boolean
        default: false
      skip-generation:
        description: 'Skip generation'
        type: boolean
        default: false
      skip-reconciliation:
        description: 'Skip reconciliation'
        type: boolean
        default: false
      skip-commit:
        description: 'Skip commit'
        type: boolean
        default: false
      commit-scope:
        description: 'Commit every new or changed package file, or only the folders main does not hold'
        type: choice
        options:
          - changed-packages
          - new-folders
        default: 'changed-packages'

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: '24'
  AWS_REGION: 'us-east-1'

jobs:

  params:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "github.event_name=[${{ github.event_name }}]"
        run: ":"
      - name: "github.ref=[${{ github.ref }}]"
        run: ":"
      - name: "inputs.skip-tests=[${{ inputs.skip-tests }}]"
        run: ":"
      - name: "inputs.skip-generation=[${{ inputs.skip-generation }}]"
        run: ":"
      - name: "inputs.skip-reconciliation=[${{ inputs.skip-reconciliation }}]"
        run: ":"
      - name: "inputs.skip-commit=[${{ inputs.skip-commit }}]"
        run: ":"
      - name: "inputs.commit-scope=[${{ inputs.commit-scope }}]"
        run: ":"
      - name: Normalise Params
        id: normalise
        shell: bash
        env:
          COMMIT_SCOPE_INPUT: ${{ inputs.commit-scope }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SKIP_TESTS='${{ inputs.skip-tests }}'; [[ -z "$SKIP_TESTS" ]] && SKIP_TESTS="false"
          echo "skip-tests=${SKIP_TESTS}" | tee -a "$GITHUB_OUTPUT"
          SKIP_GENERATION='${{ inputs.skip-generation }}'; [[ -z "$SKIP_GENERATION" ]] && SKIP_GENERATION="false"
          echo "skip-generation=${SKIP_GENERATION}" | tee -a "$GITHUB_OUTPUT"
          SKIP_RECONCILIATION='${{ inputs.skip-reconciliation }}'; [[ -z "$SKIP_RECONCILIATION" ]] && SKIP_RECONCILIATION="false"
          echo "skip-reconciliation=${SKIP_RECONCILIATION}" | tee -a "$GITHUB_OUTPUT"
          SKIP_COMMIT='${{ inputs.skip-commit }}'; [[ -z "$SKIP_COMMIT" ]] && SKIP_COMMIT="false"
          echo "skip-commit=${SKIP_COMMIT}" | tee -a "$GITHUB_OUTPUT"
          # A schedule and a push carry no inputs. A called workflow sees its caller's event.
          COMMIT_SCOPE="$COMMIT_SCOPE_INPUT"
          if [[ -z "$COMMIT_SCOPE" ]]; then
            if [[ "$EVENT_NAME" == "schedule" ]]; then COMMIT_SCOPE="new-folders"; else COMMIT_SCOPE="changed-packages"; fi
          fi
          case "$COMMIT_SCOPE" in
            changed-packages | new-folders) ;;
            *) echo "::error::Unknown commit-scope '${COMMIT_SCOPE}'"; exit 1 ;;
          esac
          echo "commit-scope=${COMMIT_SCOPE}" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.normalise.outputs.commit-scope == 'new-folders' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: ${{ steps.normalise.outputs.commit-scope == 'new-folders' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        if: ${{ steps.normalise.outputs.commit-scope == 'new-folders' }}
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Check the window for new folders
        id: window
        shell: bash
        env:
          COMMIT_SCOPE: ${{ steps.normalise.outputs.commit-scope }}
          SKIP_TESTS: ${{ steps.normalise.outputs.skip-tests }}
          SKIP_GENERATION: ${{ steps.normalise.outputs.skip-generation }}
          SKIP_RECONCILIATION: ${{ steps.normalise.outputs.skip-reconciliation }}
          SKIP_COMMIT: ${{ steps.normalise.outputs.skip-commit }}
        run: |
          # A new-folders run writes only the folders main lacks. When the window holds none,
          # every later job is skipped. A changed-packages run passes its skips through.
          if [[ "$COMMIT_SCOPE" == "new-folders" ]]; then
            WORK=$(mktemp -d)
            node app/bin/generate.js --package bst --list | sort > "$WORK/window.txt"
            git ls-tree --name-only HEAD packages/ | sed 's|^packages/||' | sort > "$WORK/held.txt"
            MISSING=$(comm -23 "$WORK/window.txt" "$WORK/held.txt")
            if [[ -z "$MISSING" ]]; then
              SKIP_TESTS=true; SKIP_GENERATION=true; SKIP_RECONCILIATION=true; SKIP_COMMIT=true
              echo "The bst window holds no package folder that main lacks, so this run stops after params." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "Package folders main lacks:"
              echo "$MISSING"
            fi
          fi
          echo "skip-tests=${SKIP_TESTS}" | tee -a "$GITHUB_OUTPUT"
          echo "skip-generation=${SKIP_GENERATION}" | tee -a "$GITHUB_OUTPUT"
          echo "skip-reconciliation=${SKIP_RECONCILIATION}" | tee -a "$GITHUB_OUTPUT"
          echo "skip-commit=${SKIP_COMMIT}" | tee -a "$GITHUB_OUTPUT"
    outputs:
      skip-tests: ${{ steps.window.outputs.skip-tests }}
      skip-generation: ${{ steps.window.outputs.skip-generation }}
      skip-reconciliation: ${{ steps.window.outputs.skip-reconciliation }}
      skip-commit: ${{ steps.window.outputs.skip-commit }}
      commit-scope: ${{ steps.normalise.outputs.commit-scope }}

  test:
    runs-on: ubuntu-24.04
    needs: [params]
    if: ${{ needs.params.outputs.skip-tests != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - run: npm test
        env:
          # This job has node alone, so the router covers the app tiers here.
          TEST_SCOPE_TIERS: unit,calc
          PINNED_AGE_CHECK: "off"

  generate:
    runs-on: ubuntu-24.04
    needs: [params, test]
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.params.outputs.skip-generation != 'true' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Install pandoc and weasyprint
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pandoc
          pip install --quiet weasyprint==70.0 pydyf==0.13.0 fonttools==4.68.0
      - run: rm -rf packages
      - name: Generate the bst packages
        run: |
          npm run generate -- --package bst --source-date-epoch "$(git log -1 --format=%ct -- app/templates/bst)"
      - name: Compute reconciliation matrix
        id: matrix
        run: |
          YEAR_ENDS=$(ls -d packages/GB\ Accounts\ Basic\ Sole\ Trader*/ 2>/dev/null \
            | sed 's|.*/GB Accounts Basic Sole Trader \([0-9-]*\).*|\1|' \
            | sort -r \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "year-ends=$YEAR_ENDS" | tee -a "$GITHUB_OUTPUT"
          LATEST=$(echo "$YEAR_ENDS" | jq -r '.[0]')
          echo "latest=$LATEST" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bst-packages
          retention-days: 1
          path: packages/
    outputs:
      matrix: ${{ steps.matrix.outputs.year-ends }}
      latest: ${{ steps.matrix.outputs.latest }}

  reconcile:
    runs-on: ubuntu-24.04
    needs: [params, generate]
    if: ${{ !cancelled() && (needs.generate.result == 'success' || needs.generate.result == 'skipped') && needs.params.outputs.skip-reconciliation != 'true' && needs.generate.outputs.matrix != '[]' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        year-end: ${{ fromJson(needs.generate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Install LibreOffice
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-calc poppler-utils
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bst-packages
          path: packages/
      - name: Keep the committed reports for the unit tests
        if: ${{ matrix.year-end == needs.generate.outputs.latest }}
        run: |
          mkdir -p /tmp/page-reports
          cp reports/*.md /tmp/page-reports/ 2>/dev/null || true
      - run: rm -f reports/*.md
      - run: npm run reconciliation -- --package bst --scenario basic --year-end ${{ matrix.year-end }}
      - name: Check reconciliation
        run: |
          COUNT=0
          FAIL=0
          for f in reports/*.md; do
            [ -f "$f" ] || continue
            COUNT=$((COUNT + 1))
            if grep "^Status:" "$f" | grep -q "ANOMALYDETECTED"; then FAIL=1; fi
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No reconciliation reports for ${{ matrix.year-end }}"
            exit 1
          fi
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Reconciliation anomaly for ${{ matrix.year-end }}"
            exit 1
          fi
          echo "$COUNT reports, all RECONCILES"
      # The check above stays authoritative for arithmetic. The judge covers the plausibility
      # call it cannot make, and stays skipped until the operator sets ENABLE_LLM_JUDGE.
      - name: Locate the recalculated package for the scorecard
        id: roundtrip
        run: |
          POPULATED=$(ls reports/populated/*bst-scenario-basic*.xlsx 2>/dev/null | head -1)
          if [ -z "$POPULATED" ]; then
            echo "::warning::No recalculated package for ${{ matrix.year-end }}; skipping the roundtrip scorecard"
            echo "populated=" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "populated=$(dirname "$POPULATED")" | tee -a "$GITHUB_OUTPUT"
          # The fixture's transactions carry the master's own fixed calendar
          # dates whichever year-end package they are stamped into --
          # cellWrites never shifts them -- so the year the tax data itself
          # names is the only sensible --years for the JS side.
          YE="${{ matrix.year-end }}"
          Y=$((10#${YE:0:4}))
          echo "years=se-$((Y - 1))-$Y" | tee -a "$GITHUB_OUTPUT"
      - name: 'Roundtrip scorecard against the recalculated package (EQ2 budget gate, EQ1 informational)'
        if: ${{ steps.roundtrip.outputs.populated != '' }}
        run: |
          node app/bin/report.js --package bst --source-dir "${{ steps.roundtrip.outputs.populated }}" --mode saved --year-end ${{ matrix.year-end }} --output-dir target/bst-scorecard-excel
          node app/bin/export.js --package bst --source-dir "${{ steps.roundtrip.outputs.populated }}" --output-dir target/bst-scorecard-excel/data
          node app/bin/report.js --package bst --data examples/precision-code-ltd/bst --years ${{ steps.roundtrip.outputs.years }} --output-dir target/bst-scorecard-js
          # Only linesLost and fieldsDropped are gated here
          # (app/data/roundtrip-matrix-budget.json), not differing/noJsValue/
          # noExcelValue: the report-half comparison is only exact for the one
          # year-end that happens to equal the master's own period end
          # (examples/precision-code-ltd/bst/book.toml's periodCoveredEnd);
          # every other year picks up whatever that year's own tax-rate
          # tables move. The scorecard still prints in full for visibility.
          node app/bin/verify-roundtrip.js --package bst --excel target/bst-scorecard-excel --js target/bst-scorecard-js --budget app/data/roundtrip-matrix-budget.json
      - name: 'EQ3: stability of the recalculated package'
        if: ${{ steps.roundtrip.outputs.populated != '' }}
        run: node app/bin/verify-stability.js --package bst --source-dir "${{ steps.roundtrip.outputs.populated }}" --output-dir target/bst-scorecard-stability
      - name: Configure AWS role via GitHub OIDC
        if: ${{ matrix.year-end == needs.generate.outputs.latest && vars.ENABLE_LLM_JUDGE == 'true' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SPREADSHEETS_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3
      - name: Judge the reconciliation reports
        if: ${{ matrix.year-end == needs.generate.outputs.latest && vars.ENABLE_LLM_JUDGE == 'true' }}
        timeout-minutes: 10
        run: npm run judge:reconciliation -- --package bst
      # Runs here, not in the generate job: this is the first point where the fresh
      # packages/ (downloaded above) are in place, so the unit tests that read the
      # committed example compare it against the template that produced it.
      - name: Unit tests against the fresh packages
        if: ${{ matrix.year-end == needs.generate.outputs.latest }}
        env:
          PINNED_AGE_CHECK: "off"
        run: |
          cp -n /tmp/page-reports/*.md reports/ 2>/dev/null || true
          node app/bin/build-sitemaps.js
          # donate.html is generated and gitignored, and this step runs vitest
          # directly rather than through npm test, so the smoke test that fetches
          # the page 404s without this line.
          node scripts/build-donate-page.mjs
          # The files whose committed-output reads stay inside this product, worked out from
          # the test files themselves. Anything reading a second product's example, or the
          # committed reports, waits for the push-side test workflow, which runs every file
          # against a tree where all four products are settled.
          npx vitest run --project unit-tests $(node scripts/leg-test-files.mjs bst)

  reconcile-extra:
    runs-on: ubuntu-24.04
    needs: [params, generate, reconcile]
    if: ${{ !cancelled() && needs.reconcile.result == 'success' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Install LibreOffice
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-calc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bst-packages
          path: packages/
      - run: rm -f reports/*.md
      - name: Reconcile extra scenarios against latest package
        run: |
          npm run reconciliation -- --package bst --scenario brickwork-pro-nonvat --year-end ${{ needs.generate.outputs.latest }}
          npm run reconciliation -- --package bst --scenario sp-sixty --year-end ${{ needs.generate.outputs.latest }}
      - name: Check extra reconciliation
        run: |
          COUNT=0
          FAIL=0
          for f in reports/*.md; do
            [ -f "$f" ] || continue
            COUNT=$((COUNT + 1))
            if grep "^Status:" "$f" | grep -q "ANOMALYDETECTED"; then FAIL=1; fi
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No extra reconciliation reports"
          elif [ "$FAIL" -eq 1 ]; then
            echo "::warning::Extra reconciliation anomaly (non-blocking)"
          else
            echo "$COUNT extra reports, all RECONCILES"
          fi

  commit:
    runs-on: ubuntu-24.04
    needs: [params, generate, reconcile, reconcile-extra]
    if: ${{ !cancelled() && (needs.reconcile.result == 'success' || needs.reconcile.result == 'skipped') && needs.params.outputs.skip-commit != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bst-packages
          path: packages/
      - name: Commit and push
        id: push
        continue-on-error: true
        env:
          COMMIT_SCOPE: ${{ needs.params.outputs.commit-scope }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git reset -q
          if [[ "$COMMIT_SCOPE" == "new-folders" ]]; then
            # Only the package folders that main does not hold yet.
            for dir in packages/*/; do
              if [[ -z "$(git ls-files -- "$dir" | head -1)" ]]; then
                git add -- "$dir"
              fi
            done
          else
            # Every new or changed package file. --ignore-removal stages no deletion, so a
            # committed folder outside this run's year-end window stays on main.
            git add --ignore-removal -- packages/
          fi
          git restore --worktree -- .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git diff --staged --name-only | head -50
            git commit -m "Generate BST packages from app/data and app/templates

          Triggered by: ${{ github.sha }}"
            git pull --rebase
            # --no-verify: the pre-push router has nothing to add to output this run has
            # already generated, reconciled and tested.
            git push --no-verify
          fi
      - name: Retry push after delay
        if: ${{ steps.push.outcome == 'failure' }}
        run: |
          for i in 5 10 15 20 25 30; do
            echo "Waiting... ${i}s"
            sleep 5
          done
          git pull --rebase
          git push --no-verify
