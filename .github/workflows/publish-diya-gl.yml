name: publish-diya-gl
run-name: "publish-diya-gl from ${{ github.ref_name }}"

# Publishes diya-gl/package.json's version to npm if that version is not on the
# registry yet, records the release, then rolls the patch version on main so the
# next prod deploy publishes the next version. deploy.yml calls this after every
# green prod deploy from main; the roll commit is pushed with GITHUB_TOKEN, which
# fires no workflow, so a version commit on its own never publishes.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:

  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Decide whether this version is already on npm
        id: version
        run: |
          PKG_NAME=$(node -p "require('./diya-gl/package.json').name")
          PKG_VERSION=$(node -p "require('./diya-gl/package.json').version")
          echo "name=${PKG_NAME}" | tee -a "$GITHUB_OUTPUT"
          echo "version=${PKG_VERSION}" | tee -a "$GITHUB_OUTPUT"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} is already on npm; nothing to publish"
            echo "publish=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "Publishing ${PKG_NAME}@${PKG_VERSION}"
            echo "publish=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Check the npm publish token is configured
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set. Add an npm granular token for the @diy-accounting-uk scope."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Node dependencies
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Build provenance data
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: npm run build:provenance-data

      - name: diya-gl package dependencies
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: cd diya-gl && npm ci

      - name: Pack diya-gl and run each bin from the tarball
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: diya-gl/smoke.sh target/diya-gl-smoke

      - name: Publish to npm
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: cd diya-gl && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Find the packed tarball
        if: ${{ steps.version.outputs.publish == 'true' }}
        id: tarball
        run: |
          TARBALL=$(basename "$(ls target/diya-gl-smoke/*.tgz)")
          echo "name=${TARBALL}" | tee -a "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ steps.version.outputs.publish == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the diya-gl image
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: |
          docker build \
            --build-arg TARBALL="${{ steps.tarball.outputs.name }}" \
            --build-arg VERSION="${{ steps.version.outputs.version }}" \
            -t "ghcr.io/diy-accounting-uk/diya-gl:${{ steps.version.outputs.version }}" \
            -f diya-gl/Dockerfile \
            target/diya-gl-smoke

      - name: Image smoke test
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: diya-gl/image-smoke.sh "ghcr.io/diy-accounting-uk/diya-gl:${{ steps.version.outputs.version }}" "$PWD"

      - name: Push the diya-gl image to GHCR
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: |
          docker tag "ghcr.io/diy-accounting-uk/diya-gl:${{ steps.version.outputs.version }}" ghcr.io/diy-accounting-uk/diya-gl:latest
          docker push "ghcr.io/diy-accounting-uk/diya-gl:${{ steps.version.outputs.version }}"
          docker push ghcr.io/diy-accounting-uk/diya-gl:latest

      - name: Tag the published commit
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "diya-gl-v${{ steps.version.outputs.version }}" -m "diya-gl ${{ steps.version.outputs.version }}"
          git push origin "diya-gl-v${{ steps.version.outputs.version }}"

      - name: Record the release and rebuild the reconciled-releases page
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: |
          node app/bin/build-reconciliation-pages.js --record "diya-gl-v${{ steps.version.outputs.version }}"
          node app/bin/build-reconciliation-pages.js --index-only

      - name: Roll the patch version for the next publish
        if: ${{ steps.version.outputs.publish == 'true' }}
        id: roll
        run: |
          cd diya-gl
          NEXT=$(npm version patch --no-git-tag-version)
          echo "next=${NEXT#v}" | tee -a "$GITHUB_OUTPUT"

      - name: Commit the release record and the rolled version onto main
        if: ${{ steps.version.outputs.publish == 'true' }}
        id: push
        continue-on-error: true
        run: |
          git add app/data/releases.json \
            web/spreadsheets.diyaccounting.co.uk/public/reconciliation/releases.html \
            web/spreadsheets.diyaccounting.co.uk/public/reconciliation/releases.json \
            diya-gl/package.json diya-gl/package-lock.json
          git commit -m "Published diya-gl ${{ steps.version.outputs.version }}; next publish is ${{ steps.roll.outputs.next }}"
          git restore .
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Retry push after delay
        if: ${{ steps.version.outputs.publish == 'true' && steps.push.outcome == 'failure' }}
        run: |
          for i in 5 10 15 20 25 30; do
            echo "Waiting... ${i}s"
            sleep 5
          done
          git restore .
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
