name: apt-install
description: >-
  Install apt packages from a cache of .deb files, so a job downloads only what the
  cache lacks. The Ubuntu mirror serves some runners at tens of KB/s, too slow for the
  100 MB that libreoffice-calc pulls in. The cache refreshes weekly.
inputs:
  packages:
    description: Space-separated apt package names.
    required: true
  no-install-recommends:
    description: Pass --no-install-recommends to apt-get install.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Name the deb cache
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        NO_RECOMMENDS: ${{ inputs.no-install-recommends }}
      run: |
        set -euo pipefail
        hash=$(printf '%s %s' "$PACKAGES" "$NO_RECOMMENDS" | sha256sum | cut -c1-16)
        echo "prefix=apt-debs-${ImageOS:-unknown}-${RUNNER_ARCH}-${hash}-" >> "$GITHUB_OUTPUT"
        echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
    - name: Restore the deb cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/apt-debs
        key: ${{ steps.key.outputs.prefix }}${{ steps.key.outputs.week }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: Install the packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        NO_RECOMMENDS: ${{ inputs.no-install-recommends }}
      run: |
        set -euo pipefail
        debs="$HOME/apt-debs"
        mkdir -p "$debs/partial"
        sudo rm -f /var/lib/man-db/auto-update
        opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o "Dir::Cache::archives=$debs")
        sudo apt-get update "${opts[@]}"
        flags=(-y)
        if [ "$NO_RECOMMENDS" = "true" ]; then flags+=(--no-install-recommends); fi
        read -r -a names <<< "$PACKAGES"
        sudo apt-get install "${flags[@]}" "${opts[@]}" "${names[@]}"
        sudo apt-get autoclean "${opts[@]}"
        sudo rm -rf "$debs/partial" "$debs/lock"
        sudo chown -R "$(id -u):$(id -g)" "$debs"
        echo "deb cache: $(find "$debs" -name '*.deb' | wc -l) files, $(du -sh "$debs" | cut -f1)"
    - name: Save the deb cache
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/apt-debs
        key: ${{ steps.key.outputs.prefix }}${{ steps.key.outputs.week }}
