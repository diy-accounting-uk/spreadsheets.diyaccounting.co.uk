<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Books save probe</title>
    <style>
      body {
        margin: 0;
        padding: 1rem;
        font:
          13px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        background: #fff;
        color: #111;
      }
      h1 {
        font-size: 1rem;
        margin: 0 0 0.25rem;
      }
      p {
        margin: 0 0 1rem;
        color: #555;
      }
      button {
        font: inherit;
        padding: 0.4rem 0.8rem;
        margin-right: 0.5rem;
      }
    </style>
  </head>
  <body data-save-state="loading">
    <h1>Books save probe</h1>
    <p>
      Loads the SP Sixty Driving BST book through the bundled engine, then saves it through the same
      <a href="save.js">save.js</a> module the books page's save controls call. Not the books page — that is
      <a href="bst.html">bst.html</a>.
    </p>
    <p id="save-probe-status">loading…</p>
    <button type="button" id="save-xlsx-btn" disabled>Save bst-excel.xlsx</button>
    <button type="button" id="save-zip-btn" disabled>Save package (.zip)</button>
    <script type="module" src="save-probe.js"></script>
  </body>
</html>
