      <div class="notespage" id="AccountingPoliciesNotes">
        <div class="header">
          <h1 class="center">
            <ix:nonNumeric contextRef="CY" name="uk-bus:EntityCurrentLegalOrRegisteredName">DIY ACCOUNTING LIMITED</ix:nonNumeric>
          </h1>
        </div>
        <div class="pagecontent">
          <h2 class="center">
            <strong>									 Notes to the Abbreviated Accounts 									<br/>									for the Period Ended 								</strong>
            <strong>31st  March 2015</strong>
          </h2>
          <ul>
            <li>
              <h2>1.  										Accounting policies								</h2>
              <p class="strong">										Basis of measurement and preparation of accounts									</p>
              <p>
                <ix:nonNumeric contextRef="CY" name="uk-gaap:StatementOnBasisMeasurementPreparationAccounts">The financial statements have been prepared under the historical cost convention and in accordance with the Financial Reporting Standard for Smaller Entities (Effective April 2008)</ix:nonNumeric>
              </p>
              <p class="strong">										Turnover policy									</p>
              <p>
                <ix:nonNumeric contextRef="CY" name="uk-gaap:TurnoverPolicy">The turnover shown in the profit and loss account represents revenue earned during the period, exclusive of VAT</ix:nonNumeric>
              </p>
              <p class="strong">										Tangible fixed assets depreciation policy									</p>
              <p>
                <ix:nonNumeric contextRef="CY" name="uk-gaap:TangibleFixedAssetsPolicy">Depreciation is provided, after taking account of any grants receivable, at the following annual rates in order to write off each asset over its estimated useful life. Land &amp; Buildings 0% on cost per annum, Plant &amp; Equipment 10% on cost per annum,  Fixtures &amp; Fittings 20% on cost per annum, Office Equipment 33%  on cost per annum, Motor Vehicles 25% on cost per annum.</ix:nonNumeric>
              </p>
              <p class="strong">										Intangible fixed assets amortisation policy									</p>
              <p>
                <ix:nonNumeric contextRef="CY" name="uk-gaap:IntangibleAssetsPolicy">Intangible fixed assets (including purchased goodwill and patents) are amortised at rates calculated to write off the assets on a straight basis over their estimated useful economic lives, not to exceed twenty years. Impairment of intangible assets is only reviewed where circumstances indicate that the carrying value of an asset may not be fully recoverable.</ix:nonNumeric>
              </p>
              <p class="strong">											Valuation information and policy									</p>
              <p>
                <ix:nonNumeric contextRef="CY" name="uk-gaap:ValuationInformationPolicy">Stocks and work -in-progress are valued at the lower of cost and net realisable value, after making due allowance for obsolete and slow moving items. Cost includes all direct expenditure and an appropriate proportion of fixed and variable overheads.</ix:nonNumeric>
              </p>
              <p class="strong">											Other accounting policies									</p>
              <p>Assets obtained under hire purchase contracts or finance leases are capitalised in the balance sheet. Those held under hire purchase contracts are depreciated over their estimated useful lives. Those held under finance leases are depreciated over their estimated useful lives or the lease term, whichever is the shorter. The interest element of these obligations is charged to the profit and loss account over the relevant period. The capital element of the future payments is treated as a liability. Rentals paid under operating leases are charged to the profit and loss account on a straight line basis over the period of the lease. Research and Development Expenditure on research and development is written off in the year in which it is incurred.</p>
            </li>
          </ul>
        </div>
