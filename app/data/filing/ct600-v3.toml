# CT600 (2026) Version 3 -- full box list, HMRC form.
#
# Sources:
# - gov.uk, "Company Tax Return (CT600) 2015 Version 3", published 1 April 2026:
#   https://www.gov.uk/government/publications/corporation-tax-company-tax-return-ct600-2015-version-3
# - Form PDF, footer stamp HMRC 04/26:
#   https://assets.publishing.service.gov.uk/media/69c543424a06660f085442bd/ct600.pdf
# - Box list transcribed in _developers/hmrc-references/hmrc-forms-company.md, section 1.
# - element/xmlPath/format: HMRC RIM artefacts V1.994 (10 October 2025), CT-specDoc-v1-994.xml,
#   downloaded from https://assets.publishing.service.gov.uk/media/68e8a35c1c8b2a3b5069080c/HMRC-CT-2014-v1-994.zip
#   (research note section 7 names this download; the zip is not committed to this repo --
#   this agent fetched it once while building this file). format is read from each element's
#   XML Schema base type (e.g. CTwholePoundStructure -> "whole", CT_YesType -> "tick"); boxes
#   with no matching schema element (a tick box folded into a parent, a free-text field, or a
#   box the schema does not carry standalone, such as 980 the declaration date) get format
#   "unresolved" rather than a guessed one, or "tick"/"date"/"text" only when the research
#   note's own Notes column says so.
# - sheetCell: the CT600-sheet mapping in "The look-alike forms" section of
#   PLAN_DIYA_GL_LTD_CLI_MCP_WEB.md, cross-checked against CELL_MAP/standardReads() in
#   app/products/ltd.js. Only boxes whose cell is already read by the product carry one;
#   the rest are unmapped pending T2/T7/T8 wiring the remaining CT600-sheet cells.
version = "CT600 (2026) Version 3"
