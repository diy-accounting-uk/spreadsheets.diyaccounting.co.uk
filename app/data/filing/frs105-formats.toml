# FRS 105 micro-entity accounts formats, Companies House / Schedule 1 Section C.
#
# Sources:
# - Small Companies and Groups (Accounts and Directors' Report) Regulations 2008, SI 2008/409,
#   Schedule 1, Section C (micro-entity formats, inserted by SI 2013/3008):
#   https://www.legislation.gov.uk/uksi/2008/409/schedule/1
#   In-force consolidated text, last modified 16 April 2025, valid from 6 April 2025.
# - Headings transcribed in _developers/hmrc-references/hmrc-forms-company.md, section 4.
# - sheetCell: the Companies House accounts mapping in "The look-alike forms" section of
#   PLAN_DIYA_GL_LTD_CLI_MCP_WEB.md, cross-checked against CELL_MAP/standardReads() in
#   app/products/ltd.js. Only one of Format 1 or Format 2 may be used for the balance sheet
#   (Sch.1 para.1(1A)); this product's PubBalSht sheet follows Format 1, so only Format 1
#   headings carry a sheetCell. Format 2 is recorded for completeness (it is part of the same
#   statutory source) with no sheetCell, since the product does not use it.
source = "https://www.legislation.gov.uk/uksi/2008/409/schedule/1"
regulation = "SI 2008/409, Schedule 1, Section C, as inserted by SI 2013/3008"
inForceDate = "2025-04-16"

[[heading]]
