# HMRC Prescription of Computations (CT Computations Format), version 1.1, 20 November 2025.
#
# Sources:
# - Corporation Tax technical specifications in XBRL and iXBRL format:
#   https://www.gov.uk/government/publications/corporation-tax-technical-specifications-xbrl-and-ixbrl
# - The format PDF:
#   https://assets.publishing.service.gov.uk/media/691c7cd40dcbf6343e9a2999/ct-computations-format-version-1.1.pdf
# - Lines and XBRL tags transcribed in _developers/hmrc-references/hmrc-forms-company.md, section 3.
# - sheetCell: "The tax computation view" paragraph of PLAN_DIYA_GL_LTD_CLI_MCP_WEB.md, cross-checked
#   against CELL_MAP/standardReads() in app/products/ltd.js.
#
# Version 1.1 covers only Section 1 (Accounts Adjustments) and Section 2 (Capital Allowances,
# summary plus the main pool). It does not yet prescribe a format for trading losses brought
# forward, taxable total profits, or the financial-year tax-rate rows with marginal relief --
# HMRC's own words are "with further sections to follow". The Ltd view's CorporationTax!K22,
# K26, K28 and K35 cells (trading profit, losses b/f, taxable total profits, tax with marginal
# relief) therefore have no v1.1 computation line to attach to; they stay on the CT600 box side
# (see ct600-v3.toml boxes 155, 160, 165, 315, 430-440).
#
# xbrl is "" where the note lists no tag for that line. sheetCell is present only for the
# handful of lines the plan's narrative names; the rest are the format's line items with no
# product cell attached yet.
version = "1.1"
versionDate = "2025-11-20"
source = "https://assets.publishing.service.gov.uk/media/691c7cd40dcbf6343e9a2999/ct-computations-format-version-1.1.pdf"

